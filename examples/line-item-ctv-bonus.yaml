# OpenProposal 3.0 — Example: Bonus line item (spec § 6.5)
# Illustrative only. A CTV bonus unlocked when the buyer commits to the display
# and CTV line items together, with at least 50,000 on display, in the currency it
# commits. Its price is its own: nothing is inherited from the line items it requires.
line_item_id:   "weather-app-ctv-bonus"
status:         published
channel:        ctv
properties:
  available:
    - id: "weather-app"
      apps:
        - { store: roku_channel_store, bundle: "000000",
            store_url: "https://channelstore.roku.com/details/000000/weather-app",
            developer_domain: "weather-app.example" }
      child_audience: general
      seller_relationship: owner
      seller_accounts: [{ asi: "ssp-a.example", sid: "pub-1001" }]
  included: ["weather-app"]
environments:   { available: ["ctv"], included: ["ctv"] }
placement:      { plcmt: 1, ssai: 3 }      # Instream (1); all server-side (3) (§ 5.2.2)
formats:        { available: ["ctv/instream-15s"], included: ["ctv/instream-15s"] }
creative_delivery: { method: seller_hosted, protocols: [13], secure_required: true }   # VAST 4.2 (13)

frequency_cap:  { count: { min: 1, max: 2, default: 1 }, period: day, per: household }
time_zone:      viewer_local

requires:
  all_of:  ["business-daily-display", "weather-app-ctv"]
  min_commitments:
    - { line_item_id: "business-daily-display", basis: spend, amount: 50000.00 }

pricing:
  - { pricing_id: "ctv-bonus-flat-usd", cost_method: FLAT, list_rate: 0.00,
      price_valid_until: "2026-12-01T23:59:59Z", currency: USD }

cancellation_policy:
  available:
    - { id: "notice-14d", notice_duration: "P14D", max_share: 1, fees: [{ calculation: none }] }
  included:     ["notice-14d"]
visibility:   registry_gated     # its requires names the gated display line item

transaction_mechanism:
  available:  [{ id: direct_io, delivery_type: non_guaranteed }]
  included:   ["direct_io"]
  max_select: 1
serving_mode:      dai
