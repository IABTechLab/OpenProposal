# OpenProposal 3.0 — Example: Issued proposal, partly agreed (spec § 6.12)
# Illustrative only. Seller names and rates are fictional. The seller issues this
# proposal to Agency A from version 2 of the shared proposal in examples/proposal.yaml.
# One line item is agreed at version 1. The seller then revises the other, so the
# proposal is at version 2 and the entries still name version 1. A party verifies them
# over version 1, restricted to their line_item_ids (§ 4.1.2).
proposal_id:       "examplepub-agencya-q4-2026-omni"
version:           2
spec_version:      "3.0"
seller:            { domain: "examplepub.example", legal_name: "Example Publisher US",
                     registry_id: "reg:examplepub-digital" }
buyer:             { domain: "agency-a.example", legal_name: "Agency A LLC" }
type:              standard
issued_from:       { proposal_id: "examplepub-us-q4-2026-omni", version: 2 }
status:            published           # derived: one line item remains offered (§ 4.3.3)
offer_window:      { start: "2026-10-01T00:00:00Z", end: "2026-12-31T23:59:59Z" }

description: >
  Display and CTV line items for Agency A, issued from the Q4 omnichannel proposal.

assent:
  - { role: commitment, version: 1,
      record_digest: "sha256:5bacc69b5ecb0f6bb6ff572d4c5ee6596cc5ff1e1f5daef35d535adc61d81d2e",
      line_item_ids: ["business-daily-display"],
      signed_at: "2026-10-05T10:14:03Z" }
  - { role: acceptance, version: 1,
      record_digest: "sha256:5bacc69b5ecb0f6bb6ff572d4c5ee6596cc5ff1e1f5daef35d535adc61d81d2e",
      line_item_ids: ["business-daily-display"],
      signed_at: "2026-10-05T10:31:47Z" }

negotiation_history:
  - { version: 1, actor: seller, action: published, paths: [],
      at: "2026-10-04T09:00:00Z" }
  - { version: 2, actor: seller, action: published,
      paths: [{ line_item_id: "weather-app-ctv", pointer: "/materials_due" }],
      at: "2026-10-06T16:20:00Z" }

line_items:
  - line_item_id:   "business-daily-display"
    status:         agreed
    channel:        display
    properties:
      available:    [{ id: "business-daily", domains: ["business-daily.example"] }]
      included:     ["business-daily"]
    buyer_supplied:
      suppression_allowed: true
      suppression_list:    { source: "advertiser_crm", size: 340000, match_method: "ramp_id" }
    formats:
      available:    ["display/300x250", "display/970x250"]
      included:     ["display/300x250"]
      deltas:       { "display/970x250": { delta_cpm: 3.00 } }
      selected:     ["display/300x250", "display/970x250"]   # the buyer's write
    exclusions_accepted:
      types:        [domain, keyword]
      max_entries:  { domain: 5000, keyword: 500 }
      enforcement:  { domain: pre_serve, keyword: best_effort }
    exclusions:                        # supplied by the buyer
      domain:       ["example-gambling.example"]
      keyword:      ["crypto"]
    geo:
      allowed:      ["US"]
      default:      { include: ["US"] }
      value:        { include: ["US"], exclude: ["US-TX"] }  # the buyer's write
    frequency_cap:  { count: { min: 1, max: 5, default: 3, value: 4 }, period: day, per: device }
    time_zone:      "America/New_York"
    pricing:
      # agreed_rate: (24.00 + 3.00) x (1 + 0.02) = 27.54 (§ 5.6)
      - { cost_method: CPM, list_rate: 24.00, agreed_rate: 27.54,
          price_valid_until: "2026-11-15T23:59:59Z", currency: USD }
    commitment_bounds: { min_budget: 10000.00, max_budget: 500000.00 }
    cancellation_policy:
      available:    [{ id: "notice-14d" }, { id: "notice-7d" }]
      included:     ["notice-14d"]
      deltas:       { "notice-7d": { delta_fraction: 0.02 } }
      max_select:   1
      selected:     ["notice-7d"]                            # the buyer's write
    commitment:
      proposal_id:     "examplepub-agencya-q4-2026-omni"
      version:         1
      basis:           spend
      amount:          80000.00
      currency:        USD
      flight:          { start: "2026-10-12T00:00:00Z", end: "2026-12-21T23:59:59Z" }
      advertisers:     [{ domain: "brand-a.example" }]
      derived_units:   2904865             # derived: 80000.00 / 27.54 × 1000
      idempotency_key: "agency-a-camp1-business-daily-display-8f42c1a9"
    hold_terms:     { available: true, duration: "P7D" }
    visibility:     named
    eligible_buyers: ["agency-a.example"]
    transaction_mechanism: { available: ["programmatic_guaranteed"],
                             included: ["programmatic_guaranteed"], max_select: 1 }

  - line_item_id:   "weather-app-ctv"
    status:         published
    channel:        ctv
    properties:     { available: [{ id: "weather-app" }], included: ["weather-app"] }
    formats:
      available:    ["ctv/instream-15s"]
      included:     ["ctv/instream-15s"]
    materials_due:  { at: "2026-10-20T23:59:59Z" }   # version 1 had "2026-10-13T23:59:59Z"
    pricing:
      - { cost_method: CPM, list_rate: 45.00,
          price_valid_until: "2026-12-01T23:59:59Z", currency: USD }
    commitment_bounds: { min_budget: 25000.00 }
    hold_terms:     { available: true, duration: "P14D" }
    hold:                                # granted on version 1, re-offered at version 2
      status:       held
      version:      2
      requested_terms:
        commitment:
          proposal_id:     "examplepub-agencya-q4-2026-omni"
          version:         1
          basis:           spend
          amount:          160000.00
          currency:        USD
          flight:          { start: "2026-11-02T00:00:00Z", end: "2026-12-21T23:59:59Z" }
          idempotency_key: "agency-a-camp1-weather-app-ctv-hold-3b7d20e4"
        properties: { selected: ["weather-app"] }
      held_availability: { unit: impressions, as_of: "2026-10-06T16:20:00Z",
                           type: reservable, quantity: 3555555 }
      position:     1
      valid_until:  "2026-10-20T00:00:00Z"
    visibility:     named
    eligible_buyers: ["agency-a.example"]
    transaction_mechanism: { available: ["programmatic_guaranteed"],
                             included: ["programmatic_guaranteed"], max_select: 1 }
