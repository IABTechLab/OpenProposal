version:           2
spec_version:      "3.0"
seller:            { domain: "examplepub.example", legal_name: "Example Publisher US",
                     registry_id: "reg:examplepub-digital" }
buyer:             { domain: "agency-a.example", legal_name: "Agency A LLC" }
type:              custom
brief_id:          "agency-a-brief-q4-2026"
status:            agreed              # derived: no line item remains offered (§ 4.3.3)
offer_window:      { start: "2026-09-14T00:00:00Z", end: "2026-12-31T23:59:59Z" }

description: >
  Display and CTV package for Agency A, built from its brief.

assent:
  - { role: commitment, version: 2,
      record_digest: "sha256:705b387e84879cbad61ab7bf6239af5462d9a0ae3e32fa5bf131103726822846",
      line_item_ids: ["business-daily-display", "weather-app-ctv"],
      at: "2026-09-22T10:14:03Z",
      idempotency_key: "agency-a-camp1-q4-2026-5d10e2c7" }
  - { role: acceptance, version: 2,
      record_digest: "sha256:705b387e84879cbad61ab7bf6239af5462d9a0ae3e32fa5bf131103726822846",
      line_item_ids: ["business-daily-display", "weather-app-ctv"],
      at: "2026-09-22T10:31:47Z" }

negotiation_history:
  - { version: 1, actor: seller, action: published, paths: [],
      at: "2026-09-14T09:00:00Z" }
  - { version: 1, actor: buyer, action: requested,
      paths: [{ line_item_id: "business-daily-display", pointer: "/materials_due",
                requested_value: { materials_due: { at: "2026-10-01T23:59:59Z" } } }],
      at: "2026-09-14T09:02:11Z" }
  - { version: 2, actor: seller, action: countered,     # another value, version 2
      paths: [{ line_item_id: "business-daily-display", pointer: "/materials_due" }],
      at: "2026-09-14T09:40:05Z" }

# Changes requested after agreed. Outside record_digest; the terms stay as agreed.
# The first line item has an OpenDirect reservation. The second is a deal with no
# Order, so its entry has no Order keys.
change_requests:
  - { id: "67853",
      baseline: { proposal_id: "examplepub-agencya-custom-q4-2026", version: 2,
                  line_item_id: "business-daily-display" },
      actor: buyer, at: "2026-11-02T15:20:00Z",
      accountid: "23873345", orderid: "345233", lineid: "778120",
      requesterid: "7987654", status: PENDING,
      comments: "Shorten the flight to end on 2026-12-07." }
  - { id: "agency-a-change-0002",
