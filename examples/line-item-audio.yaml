# OpenProposal 3.0 — Example: Audio line item (spec § 6.4)
line_item_id:   "streaming-audio"
status:         published
channel:        audio
environments:   { available: ["web_mobile", "app_mobile"],
                  included:  ["web_mobile", "app_mobile"] }
formats:        { available: ["audio/host-read-30s", "audio/produced-30s"],
                  included: ["audio/produced-30s"],
                  deltas: { "audio/host-read-30s": { delta_cpm: 9.00 } } }

production:
  available:    [{ id: "seller_built", build_owner: seller, lead_time: "P14D" },
                 { id: "buyer_supplied", build_owner: buyer, lead_time: "P0D" }]
  included:     ["buyer_supplied"]
  deltas:       { seller_built: { delta_flat: 12000.00 } }

markets:                               # priced by market (§ 5.5)
  available:    ["US", "CA", "GB"]
  included:     ["US"]
  deltas:       { "CA": { delta_cpm: 1.50 }, "GB": { delta_cpm: 3.00 } }
  max_select:   3

frequency_cap:  { count: { min: 1, max: 6, default: 3 }, period: day, per: listener }
time_zone:      viewer_local

pricing:
  - { cost_method: CPM, list_rate: 18.00, min_rate: 15.84,
      price_valid_until: "2026-12-15T23:59:59Z", currency: USD,
      price_type: 3 }                  # Fixed Price

commitment_bounds: { min_budget: 5000.00 }

committed_metrics: [{ metric: completion_rate, value: 0.92, basis: seller_reported }]
visibility:        public
transaction_mechanism:
  available:  [{ id: preferred_deal, delivery_type: non_guaranteed }]
  included:   ["preferred_deal"]
  max_select: 1
serving_mode:      dai
deal_origin:       "ssp-a.example"
